<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="calculator">
            <div class="display-screen">
                <div id="previous-operand" class="previous-operand"></div>
                <div id="current-operand" class="current-operand">0</div>
            </div>

            <button class="btn-memory" onclick="memoryClear()">MC</button>
            <button class="btn-memory" onclick="memoryRecall()">MR</button>
            <button class="btn-memory" onclick="memoryMinus()">M-</button>
            <button class="btn-memory" onclick="memoryPlus()">M+</button>

            <button class="span-two" onclick="clearEntry()">CE</button>
            <button class="span-two" onclick="clearAll()">C</button>
            
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="btn-op" onclick="chooseOperation('÷')">÷</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="btn-op" onclick="chooseOperation('×')">×</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="btn-op" onclick="chooseOperation('-')">-</button>

            <button onclick="appendNumber('.')">.</button>
            <button onclick="appendNumber('0')">0</button>
            <button class="span-two btn-equal" onclick="compute()">=</button>
            <button class="btn-op" onclick="chooseOperation('+')">+</button>
        </div>

        <div class="history-panel">
            <h3>Riwayat (Terakhir 5)</h3>
            <ul id="history-list">
                </ul>
            <button id="clear-history" onclick="clearHistory()">Hapus Riwayat</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
